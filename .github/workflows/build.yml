name: Build Odin Hub

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Dar permissao de execucao ao Gradle
        run: chmod +x gradlew

      # Antes, a CI só rodava assembleDebug -- ou seja, um build que compila mas quebra em
      # runtime (como os bugs corrigidos nesta auditoria) passava verde. testDebugUnitTest roda
      # antes do build para falhar o PR cedo, em vez de só descobrir o problema num dispositivo.
      - name: Rodar os testes unitarios (Debug)
        run: ./gradlew testDebugUnitTest

      - name: Upload do relatorio de testes (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest

      - name: Compilar o APK (Debug)
        run: ./gradlew assembleDebug

      - name: Fazer Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: OdinHub
          path: app/build/outputs/apk/**/*.apk